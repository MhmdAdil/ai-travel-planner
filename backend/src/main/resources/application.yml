spring:
  application:
    name: ai-travel-planner-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ai_travel_planner?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:development-only-secret-change-before-production-123456}
    expiry: ${JWT_EXPIRY:60m}
  currency:
    lkr-per-usd: ${LKR_PER_USD:310.00}
  places:
    live-enabled: ${PLACES_LIVE_ENABLED:true}
    nominatim-url: ${NOMINATIM_URL:https://nominatim.openstreetmap.org}
    overpass-url: ${OVERPASS_URL:https://overpass.private.coffee/api/interpreter}
    routing-url: ${OSRM_URL:https://router.project-osrm.org}
    user-agent: "${OSM_USER_AGENT:AITravelPlannerUniversityProject/0.3 (https://github.com/MhmdAdil/ai-travel-planner)}"
    search-radius-metres: ${PLACE_SEARCH_RADIUS_METRES:30000}
